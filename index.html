<style>
:root {
  --primary: #38bdf8;
  --dark: #020617;
  --bg: #0f172a;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 10;
  background: rgba(2,6,23,.7);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 40px;
}

nav .logo {
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 1px;
}

nav ul {
  display: flex;
  gap: 30px;
  list-style: none;
}

nav ul li a {
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
}

nav .whats {
  background: rgba(56,189,248,.15);
  padding: 10px 18px;
  border-radius: 30px;
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
}

/* HERO */
header {
  min-height: 100vh;
  background:
    linear-gradient(rgba(2,6,23,.85), rgba(2,6,23,.85)),
    url("hero-codewise.png") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 20px 40px;
}

.hero {
  max-width: 900px;
}

.hero h1 {
  font-size: 46px;
  color: var(--primary);
  margin-bottom: 10px;
}

.hero h2 {
  font-size: 14px;
  letter-spacing: 4px;
  color: var(--muted);
  margin-bottom: 25px;
}

.hero p {
  font-size: 18px;
  margin-bottom: 35px;
}

.btn {
  display: inline-block;
  padding: 16px 30px;
  background: var(--primary);
  color: var(--dark);
  border-radius: 12px;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 0 30px rgba(56,189,248,.4);
  transition: transform .2s;
}

.btn:hover {
  transform: translateY(-4px);
}

/* SECTIONS */
section {
  max-width: 1100px;
  margin: auto;
  padding: 80px 20px;
}

section h3 {
  text-align: center;
  font-size: 32px;
  color: var(--primary);
  margin-bottom: 50px;
}

/* ABOUT */
.about {
  text-align: center;
  font-size: 18px;
  color: var(--muted);
}

/* SERVICES */
.services {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

.card {
  background: var(--dark);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 15px 30px rgba(0,0,0,.4);
}

.card h4 {
  color: var(--primary);
  margin-bottom: 10px;
}

/* CONTACT */
.contact {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
  text-align: center;
}

.contact p {
  font-size: 16px;
}

/* FOOTER */
footer {
  background: var(--dark);
  text-align: center;
  padding: 30px 20px;
  color: var(--muted);
  font-size: 14px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  nav ul {
    display: none;
  }

  .hero h1 {
    font-size: 34px;
  }
}
</style>
</head>
