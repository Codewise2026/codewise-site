<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>IVAN SANTOS LTDA | CODEWISE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #38bdf8;
  --dark: #020617;
  --bg: #0f172a;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 10;
  background: rgba(2,6,23,.7);
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: space-between;
  padding: 15px 40px;
}

nav .logo { color: var(--primary); font-weight: 700; }

/* HERO */
header {
  min-height: 100vh;
  background: linear-gradient(rgba(2,6,23,.85), rgba(2,6,23,.85));
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-top: 100px;
}

.hero h1 { font-size: 46px; color: var(--primary); }

/* SECTIONS */
section { max-width: 1100px; margin: auto; padding: 80px 20px; }

h3 { text-align: center; color: var(--primary); margin-bottom: 40px; }

/* INSIGHTS */
.insights {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap: 25px;
}

.insight {
  background: rgba(56,189,248,.15);
  padding: 25px;
  border-radius: 16px;
  text-align: center;
}

.insight span {
  display: block;
  font-size: 28px;
  font-weight: bold;
  color: var(--primary);
}

/* CHAT */
#chatBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--primary);
  border: none;
  border-radius: 50%;
  padding: 15px;
  cursor: pointer;
  font-size: 18px;
}

#chatBox {
  display: none;
  position: fixed;
  bottom: 90px;
  right: 20px;
  background: var(--dark);
  padding: 20px;
  border-radius: 16px;
  width: 280px;
}
</style>
</head>

<body>

<header>
  <div class="hero">
    <h1>CODEWISE</h1>
    <p>Soluções Tecnológicas Inteligentes</p>
  </div>
</header>

<section>
  <h3>📊 Painel de Informações</h3>

  <div class="insights">
    <div class="insight">
      <span id="visitas">0</span>
      Visitas
    </div>

    <div class="insight">
      <span id="hora">--:--</span>
      Hora Atual
    </div>

    <div class="insight">
      <span id="temp">-- °C</span>
      Temperatura
    </div>

    <div class="insight">
      <span id="dolar">R$ --</span>
      Dólar
    </div>

    <div class="insight">
      <span id="euro">R$ --</span>
      Euro
    </div>
  </div>
</section>

<button id="chatBtn">💬</button>

<div id="chatBox">
  <textarea placeholder="Pergunta ou sugestão..."></textarea>
  <button onclick="enviar()">Enviar</button>
</div>

<script>
/* VISITAS */
let visitas = localStorage.getItem("visitas");
visitas = visitas ? Number(visitas) + 1 : 1;
localStorage.setItem("visitas", visitas);
document.getElementById("visitas").innerText = visitas;

/* HORA */
function atualizarHora(){
  const agora = new Date();
  document.getElementById("hora").innerText =
    agora.toLocaleTimeString("pt-BR",{hour:'2-digit',minute:'2-digit'});
}
setInterval(atualizarHora,1000);
atualizarHora();

/* TEMPERATURA (Dom Aquino - MT) */
fetch("https://api.openweathermap.org/data/2.5/weather?q=Dom%20Aquino,BR&units=metric&lang=pt_br&appid=SUA_API_KEY_AQUI")
.then(r=>r.json())
.then(d=>{
  document.getElementById("temp").innerText = Math.round(d.main.temp)+" °C";
});

/* COTAÇÃO */
fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL")
.then(r=>r.json())
.then(d=>{
  document.getElementById("dolar").innerText = "R$ " + Number(d.USDBRL.bid).toFixed(2);
  document.getElementById("euro").innerText  = "R$ " + Number(d.EURBRL.bid).toFixed(2);
});

/* CHAT */
const btn = document.getElementById("chatBtn");
const box = document.getElementById("chatBox");

btn.onclick = ()=> box.style.display = box.style.display==="block"?"none":"block";
function enviar(){
  alert("Mensagem enviada!");
  box.style.display="none";
}
</script>

</body>
</html>
